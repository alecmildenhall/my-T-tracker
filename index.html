<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tints the browser's own chrome on phones — the bar above the page on
         iOS Safari and Android Chrome — so scrolling up runs into the app's dark
         rather than a light band the app doesn't control. Same colour as the
         canvas in styles.css; both are the gradient's first stop. -->
    <meta name="theme-color" content="#020617" />
    <!-- Declared here as well as in CSS so the browser knows before the
         stylesheet loads, which is what stops a white flash on first paint. -->
    <meta name="color-scheme" content="dark" />
    <title>my-t-tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
