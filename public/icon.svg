<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="T-Shot Tracker">
  <!-- The History tab's chart mark (src/components/TabBar.tsx), redrawn on a
       32 grid with a heavier stroke so it survives a 16px tab.

       Deliberately not a syringe. The roadmap plans disguise mode and an app
       lock because an identifiable T tracker is itself an exposure, and the
       icon is the most public surface the app has: it sits on a home screen,
       in a tab strip, and in the app switcher. A chart says nothing about what
       is being tracked, and matches the product's own stated identity. -->
  <rect width="32" height="32" rx="7" fill="#020617"/>
  <g fill="none" stroke="#0ea5e9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 5v21h21"/>
    <path d="m10.5 21.5 5-6 4 3 7-9"/>
  </g>
</svg>
